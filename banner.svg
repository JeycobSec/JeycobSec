<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>JeycobSec GitHub banner</title>
  <desc>Black minimal banner — systems · infrastructure · blue team</desc>

  <!-- background -->
  <rect width="680" height="200" fill="#090909" rx="6"/>

  <!-- subtle grid -->
  <line x1="0"   y1="50"  x2="680" y2="50"  stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="0"   y1="100" x2="680" y2="100" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="0"   y1="150" x2="680" y2="150" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="80"  y1="0"   x2="80"  y2="200" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="160" y1="0"   x2="160" y2="200" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="240" y1="0"   x2="240" y2="200" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="320" y1="0"   x2="320" y2="200" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="400" y1="0"   x2="400" y2="200" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="480" y1="0"   x2="480" y2="200" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="560" y1="0"   x2="560" y2="200" stroke="#1a1a1a" stroke-width="0.5"/>
  <line x1="640" y1="0"   x2="640" y2="200" stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- left cold accent line — white, not purple -->
  <rect x="0" y="0" width="2" height="200" fill="#e0e0e0"/>

  <!-- top-left label -->
  <text x="16" y="30" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" fill="#333333" letter-spacing="3">~/lab</text>

  <!-- name -->
  <text x="16" y="105" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="56" font-weight="700" fill="#e8e8e8" letter-spacing="-2">Jeycob</text>

  <!-- subtitle -->
  <text x="18" y="130" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#3d3d3d" letter-spacing="2">systems · infrastructure · blue team</text>

  <!-- tags — monochrome only -->
  <rect x="16"  y="152" width="52"  height="18" rx="2" fill="none" stroke="#222222" stroke-width="0.5"/>
  <text x="42"  y="165" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#4a4a4a" text-anchor="middle">linux</text>

  <rect x="76"  y="152" width="104" height="18" rx="2" fill="none" stroke="#222222" stroke-width="0.5"/>
  <text x="128" y="165" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#4a4a4a" text-anchor="middle">active directory</text>

  <rect x="188" y="152" width="72"  height="18" rx="2" fill="none" stroke="#222222" stroke-width="0.5"/>
  <text x="224" y="165" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#4a4a4a" text-anchor="middle">kvm · qemu</text>

  <rect x="268" y="152" width="66"  height="18" rx="2" fill="none" stroke="#222222" stroke-width="0.5"/>
  <text x="301" y="165" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#4a4a4a" text-anchor="middle">blue team</text>

  <!-- right decorative — concentric rings, white/gray, cold -->
  <circle cx="620" cy="100" r="64" fill="none" stroke="#1c1c1c" stroke-width="0.5"/>
  <circle cx="620" cy="100" r="44" fill="none" stroke="#1c1c1c" stroke-width="0.5"/>
  <circle cx="620" cy="100" r="24" fill="none" stroke="#242424" stroke-width="0.5"/>
  <line x1="556" y1="100" x2="684" y2="100" stroke="#1c1c1c" stroke-width="0.5"/>
  <line x1="620" y1="36"  x2="620" y2="164" stroke="#1c1c1c" stroke-width="0.5"/>
  <!-- center dot — white, not purple -->
  <circle cx="620" cy="100" r="2.5" fill="#c0c0c0"/>
</svg>
